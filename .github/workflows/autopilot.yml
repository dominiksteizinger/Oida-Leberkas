name: Autopilot
# Jeden Tag ein Karussell: Idee (Claude), Prüfung, Folien rendern, Tagebuch auf der Seite, Instagram/Facebook.
# Solange die Repo-Variable POSTEN nicht "an" ist, läuft alles im Probebetrieb:
# Die Ergebnisse landen nur auf dem Branch autopilot-probe, gepostet wird nichts.
on:
  schedule:
    - cron: "0 16 * * *"
  # Probeläufe nur per Hand (Actions > Autopilot > Run workflow), nicht bei jedem Push.
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: autopilot
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-latest
    env:
      LIVE: ${{ vars.POSTEN == 'an' && github.ref == 'refs/heads/main' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe-Branch holen
        if: env.LIVE != 'true'
        run: |
          git config user.name "Oida Leberkas Autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          if git fetch origin autopilot-probe:refs/remotes/origin/autopilot-probe 2>/dev/null; then
            git checkout -B autopilot-probe origin/autopilot-probe
            git merge --no-edit -X theirs "$GITHUB_SHA"
          else
            git checkout -b autopilot-probe
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Abhängigkeiten
        working-directory: autopilot
        run: npm ci --no-audit --no-fund
      - name: Ideen aus der Inbox
        run: |
          # Nur Ideen von Dominik: über die Vorlage kann jeder ein Issue mit Label idee anlegen
          gh issue list --repo "$GITHUB_REPOSITORY" --label idee --state open --json number,title,body,author \
            --jq '[.[] | select(.author.login == "${{ github.repository_owner }}") | {nummer: .number, text: (.title + ": " + .body)}]' > "$RUNNER_TEMP/ideen.json" || echo "[]" > "$RUNNER_TEMP/ideen.json"
          echo "Offene Ideen: $(jq length "$RUNNER_TEMP/ideen.json")"
      - name: Bewertungen holen
        run: |
          for u in gut schlecht; do
            gh issue list --repo "$GITHUB_REPOSITORY" --label "$u" --state all --limit 15 --json body,comments \
              --jq "[.[] | {urteil: \"$u\", text: (.body | split(\"\\n<!--\")[0]), kommentare: ([.comments[] | select(.author.login == \"${{ github.repository_owner }}\") | .body] | join(\" / \"))}]" \
              > "$RUNNER_TEMP/bewertung-$u.json" || echo "[]" > "$RUNNER_TEMP/bewertung-$u.json"
          done
          jq -s 'add' "$RUNNER_TEMP"/bewertung-*.json > "$RUNNER_TEMP/bewertungen.json"
          echo "Bewertete Einträge: $(jq length "$RUNNER_TEMP/bewertungen.json")"
      - name: Idee schreiben und prüfen
        id: idee
        working-directory: autopilot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODELL_SCHREIBEN: ${{ vars.MODELL_SCHREIBEN }}
          MODELL_PRUEFEN: ${{ vars.MODELL_PRUEFEN }}
          IDEEN_DATEI: ${{ runner.temp }}/ideen.json
          BEWERTUNGEN_DATEI: ${{ runner.temp }}/bewertungen.json
        run: node idee.mjs
      - name: Neues Bild (Gemini)
        if: vars.BILDER_GENERIEREN != 'aus'
        working-directory: autopilot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODELL_BILD: ${{ vars.MODELL_BILD }}
          MODELL_PRUEFEN: ${{ vars.MODELL_PRUEFEN }}
        run: node bild.mjs "${{ steps.idee.outputs.datum }}"
      - name: Folien rendern
        working-directory: autopilot
        run: node render.mjs "${{ steps.idee.outputs.datum }}"
      - name: Videos mit Musik
        id: video
        working-directory: autopilot
        run: |
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          node video.mjs "${{ steps.idee.outputs.datum }}" "$RUNNER_TEMP/reel"
      - name: Reel aufheben
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.idee.outputs.datum }}
          path: ${{ runner.temp }}/reel/reel.mp4
          if-no-files-found: ignore
      - name: Ins Tagebuch eintragen
        run: |
          git config user.name "Oida Leberkas Autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add tagebuch autopilot/bilder autopilot/bibliothek.json
          git commit -m "Tagebuch ${{ steps.idee.outputs.datum }}"
          if [ "$LIVE" = "true" ]; then git push origin HEAD:main; else git push origin HEAD:autopilot-probe; fi
          {
            echo "## Eintrag ${{ steps.idee.outputs.datum }} ($([ "$LIVE" = "true" ] && echo live || echo Probe))"
            jq -r '"**Folie 1:** \(.folie1)\n\n**Folie 2:** \(.folie2)\n\n**Caption:** \(.caption)\n\n**Aufforderung:** \(.aufforderung)\n\n**Hashtags:** \(.hashtags | join(" "))\n\n**Musik:** \(.musik)\n\n**Prüfung:** \(.pruefung)"' "tagebuch/${{ steps.idee.outputs.datum }}/eintrag.json"
            BR=$([ "$LIVE" = "true" ] && echo main || echo autopilot-probe)
            echo ""
            echo "![Folie 1](https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$BR/tagebuch/${{ steps.idee.outputs.datum }}/folie-1.jpg)"
            echo "![Folie 2](https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$BR/tagebuch/${{ steps.idee.outputs.datum }}/folie-2.jpg)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Zur Bewertung stellen
        run: |
          D="${{ steps.idee.outputs.datum }}"
          BR=$([ "$LIVE" = "true" ] && echo main || echo autopilot-probe)
          gh label create bewertung --repo "$GITHUB_REPOSITORY" --color B9A3FF --description "Eintrag wartet auf Dominiks Urteil" 2>/dev/null || true
          gh label create gut --repo "$GITHUB_REPOSITORY" --color 2EA043 --description "Guter Eintrag, dient als Beispiel" 2>/dev/null || true
          gh label create schlecht --repo "$GITHUB_REPOSITORY" --color D73A49 --description "Misslungen, Begründung als Kommentar" 2>/dev/null || true
          {
            jq -r '"„\(.folie1)“ / „\(.folie2)“\nCaption: \(.caption)"' "tagebuch/$D/eintrag.json"
            jq -r 'if .bild_ersatz then "Neues Bild: \(.bild_folie2) (\(.bild_neu))" else empty end' "tagebuch/$D/eintrag.json"
            echo ""
            echo "<!-- ab hier nur für Dominik -->"
            echo "![Folie 1](https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$BR/tagebuch/$D/folie-1.jpg) ![Folie 2](https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$BR/tagebuch/$D/folie-2.jpg)"
            echo ""
            echo "Label **gut** oder **schlecht** setzen und gern einen Satz als Kommentar, warum. Der Autopilot lernt beim nächsten Lauf daraus."
          } > "$RUNNER_TEMP/bewertung.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Eintrag $D ($([ "$LIVE" = "true" ] && echo live || echo Probe))" \
            --label bewertung --body-file "$RUNNER_TEMP/bewertung.md"
      - name: Posten
        if: env.LIVE == 'true'
        working-directory: autopilot
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_POSTEN: ${{ vars.FACEBOOK_POSTEN }}
        run: node posten.mjs "${{ steps.idee.outputs.datum }}"
      - name: YouTube Short
        if: env.LIVE == 'true' && vars.YOUTUBE_POSTEN == 'an'
        working-directory: autopilot
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_SICHTBARKEIT: ${{ vars.YOUTUBE_SICHTBARKEIT }}
        run: node youtube.mjs "${{ steps.idee.outputs.datum }}" "$RUNNER_TEMP/reel/reel.mp4"
      - name: Verwendete Idee abhaken
        if: env.LIVE == 'true' && steps.idee.outputs.idee != ''
        run: gh issue close "${{ steps.idee.outputs.idee }}" --repo "$GITHUB_REPOSITORY" --comment "Umgesetzt im Eintrag vom ${{ steps.idee.outputs.datum }}."
