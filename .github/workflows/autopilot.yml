name: Autopilot
# Zweimal am Tag ein Post von Resi Requiem: um 7:00 und um 16:00 Wiener Zeit.
# Der Post kommt fertig geschrieben aus der Warteschlange (Issues mit Label „warteschlange“), hier wird er nur
# gerendert, als Reel ohne Ton gebaut, ins Tagebuch der Webseite eingetragen und gepostet. Keine Claude-API.
# Solange die Repo-Variable POSTEN nicht "an" ist, läuft alles im Probebetrieb:
# Die Ergebnisse landen nur auf dem Branch autopilot-probe, gepostet wird nichts und die Warteschlange bleibt, wie sie ist.
on:
  schedule:
    # GitHub rechnet in UTC und startet geplante Läufe oft Stunden zu spät oder lässt sie ganz aus.
    # Deshalb stündlich: der Schritt „Zeitfenster“ ordnet jeden Lauf dem fälligen Slot zu,
    # „Schon gepostet?“ sorgt dafür, dass jeder Slot nur einmal gepostet wird.
    - cron: "37 4-22 * * *"
  # Probeläufe per Hand (Actions > Autopilot > Run workflow)
  workflow_dispatch:
    inputs:
      datum:
        description: "Datum für den Eintrag (JJJJ-MM-TT), leer = heute"
        required: false
        default: ""
      slot:
        description: "07 oder 16, leer = nach aktueller Uhrzeit"
        required: false
        default: ""
      issue:
        description: "Nummer eines bestimmten Warteschlangen-Issues, leer = der älteste passende"
        required: false
        default: ""
permissions:
  contents: write
  issues: write
concurrency:
  group: autopilot
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    env:
      LIVE: ${{ vars.POSTEN == 'an' && github.ref == 'refs/heads/main' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Zeitfenster
        id: zeit
        run: |
          STUNDE=$(TZ=Europe/Vienna date +%H)
          DATUM="${{ inputs.datum }}"; [ -z "$DATUM" ] && DATUM=$(TZ=Europe/Vienna date +%F)
          SLOT="${{ inputs.slot }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Fälliger Slot: 7 bis 13 Uhr holt den Morgenpost nach, ab 16 Uhr den Nachmittagspost
            case "$STUNDE" in 07|08|09|10|11|12|13) SLOT=07;; 16|17|18|19|20|21|22|23) SLOT=16;; *) echo "In Wien ist es $STUNDE Uhr, kein Slot."; echo "weiter=false" >> "$GITHUB_OUTPUT"; exit 0;; esac
          elif [ -z "$SLOT" ]; then
            [ "$STUNDE" -lt 12 ] && SLOT=07 || SLOT=16
          fi
          echo "datum=$DATUM" >> "$GITHUB_OUTPUT"
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "id=$DATUM-$SLOT" >> "$GITHUB_OUTPUT"
          echo "weiter=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.zeit.outputs.weiter == 'true'
        with:
          fetch-depth: 0
      - name: Probe-Branch holen
        if: steps.zeit.outputs.weiter == 'true' && env.LIVE != 'true'
        run: |
          git config user.name "Resi Requiem Autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          if git fetch origin autopilot-probe:refs/remotes/origin/autopilot-probe 2>/dev/null; then
            git checkout -B autopilot-probe origin/autopilot-probe
            git merge --no-edit -X theirs "$GITHUB_SHA"
          else
            git checkout -b autopilot-probe
          fi
      - name: Schon gepostet?
        id: doppelt
        if: steps.zeit.outputs.weiter == 'true'
        run: |
          # Stündliche Läufe: hat ein früherer Lauf den Slot schon gepostet, ist nichts zu tun.
          # Geplante Probeläufe zählen genauso, Probeläufe per Hand dürfen einen Slot wiederholen.
          ID="${{ steps.zeit.outputs.id }}"
          # Live zählt die Datei gepostet.txt oder der Abhak-Kommentar „Gepostet als …“ an einem Warteschlangen-Issue
          ABGEHAKT=$([ "$LIVE" = "true" ] && gh issue list --repo "$GITHUB_REPOSITORY" --label warteschlange --state closed --limit 30 \
            --json comments --jq ".[].comments[].body" | grep -c "^Gepostet als $ID\.$" || true)
          if { [ "$LIVE" = "true" ] && { [ -f "tagebuch/$ID/gepostet.txt" ] || [ "${ABGEHAKT:-0}" != "0" ]; }; } || \
             { [ "$LIVE" != "true" ] && [ "${{ github.event_name }}" = "schedule" ] && [ -f "tagebuch/$ID/post.jpg" ]; }; then
            echo "Post ${{ steps.zeit.outputs.id }} gibt es schon."; echo "weiter=false" >> "$GITHUB_OUTPUT"
          else
            echo "weiter=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.doppelt.outputs.weiter == 'true'
        with:
          node-version: 20
      - name: Abhängigkeiten
        if: steps.doppelt.outputs.weiter == 'true'
        working-directory: autopilot
        run: npm ci --no-audit --no-fund
      - name: Wien-Signale für die Schreibenden
        if: steps.doppelt.outputs.weiter == 'true' && steps.zeit.outputs.slot == '07'
        working-directory: autopilot
        run: |
          node signale.mjs "${{ steps.zeit.outputs.datum }}" > "$RUNNER_TEMP/signale.md" || exit 0
          gh label create signale --repo "$GITHUB_REPOSITORY" --color 9AA0A6 --description "Tägliche Wien-Signale für die Post-Ideen" 2>/dev/null || true
          NR=$(gh issue list --repo "$GITHUB_REPOSITORY" --label signale --state open --json number --jq '.[0].number // empty')
          [ -z "$NR" ] && NR=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "Wien-Signale" --label signale --body "Jeden Morgen hängt hier das Wetter, die Anlässe und harmlose Schlagzeilen des Tages an." | grep -o '[0-9]*$')
          gh issue comment "$NR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/signale.md"
      - name: Post aus der Warteschlange
        id: holen
        if: steps.doppelt.outputs.weiter == 'true'
        working-directory: autopilot
        run: |
          gh label create warteschlange --repo "$GITHUB_REPOSITORY" --color FF4FA3 --description "Fertiger Post, den der Autopilot als Nächstes nimmt" 2>/dev/null || true
          gh label create fehler --repo "$GITHUB_REPOSITORY" --color D73A4A --description "Post ließ sich nicht lesen" 2>/dev/null || true
          node holen.mjs "${{ steps.zeit.outputs.id }}" "${{ steps.zeit.outputs.datum }}" "${{ steps.zeit.outputs.slot }}"
        env:
          ISSUE: ${{ inputs.issue }}
      - name: Warteschlange leer melden
        if: steps.holen.outputs.gefunden == 'false' && env.LIVE == 'true'
        run: |
          gh label create leer --repo "$GITHUB_REPOSITORY" --color FBCA04 --description "Autopilot hat nichts zu posten" 2>/dev/null || true
          if [ -z "$(gh issue list --repo "$GITHUB_REPOSITORY" --label leer --state open --json number --jq '.[0].number // empty')" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --label leer --assignee "${{ github.repository_owner }}" \
              --title "Warteschlange leer: ${{ steps.zeit.outputs.id }} wurde nicht gepostet" \
              --body "Um ${{ steps.zeit.outputs.slot }}:00 lag kein fertiger Post in der Warteschlange. Neue Posts als Issue mit Label warteschlange anlegen (Aufbau siehe autopilot/README.md). Dieses Issue schließt sich beim nächsten Post von selbst."
          fi
      - name: Rendern
        if: steps.holen.outputs.gefunden == 'true'
        working-directory: autopilot
        run: |
          # Emojis in den Handy-Formaten (Wetter, Captcha usw.) brauchen eine Farb-Emoji-Schrift
          fc-list | grep -qi "Noto Color Emoji" || (sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-color-emoji)
          node render.mjs "${{ steps.zeit.outputs.id }}"
      - name: Reel (mit oder ohne Stimme)
        if: steps.holen.outputs.gefunden == 'true'
        working-directory: autopilot
        env:
          # Stimme nur, wenn die Repo-Variable STIMME "an" ist; sonst stumm wie bisher
          STIMME: ${{ vars.STIMME }}
          STIMME_STIL: ${{ vars.STIMME_STIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Jingle nur mit JINGLE="an" und vorhandener Datei autopilot/assets/jingle.mp3; JINGLE_POS "ende" (Standard) oder "anfang"
          JINGLE: ${{ vars.JINGLE }}
          JINGLE_POS: ${{ vars.JINGLE_POS }}
        run: |
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          node video.mjs "${{ steps.zeit.outputs.id }}"
      - name: Ins Tagebuch eintragen
        if: steps.holen.outputs.gefunden == 'true'
        run: |
          ID="${{ steps.zeit.outputs.id }}"
          git config user.name "Resi Requiem Autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          # Die Einzelbilder fürs Reel stecken schon im reel.mp4
          rm -f tagebuch/"$ID"/schritt-*.jpg tagebuch/"$ID"/schritte.json
          git add tagebuch
          git add autopilot/stimme-cache 2>/dev/null || true
          # Ein neuer Versuch nach gescheitertem Posten kann dieselben Dateien erzeugen
          git diff --cached --quiet || git commit -m "Tagebuch $ID"
          if [ "$LIVE" = "true" ]; then git push origin HEAD:main; else git push origin HEAD:autopilot-probe; fi
          BR=$([ "$LIVE" = "true" ] && echo main || echo autopilot-probe)
          {
            echo "## Eintrag $ID ($([ "$LIVE" = "true" ] && echo live || echo Probe), aus ${{ steps.holen.outputs.issue && format('#{0}', steps.holen.outputs.issue) }})"
            jq -r '"**Format:** \(.inhalt.format)\n\n**Caption:** \(.caption)\n\n**Aufforderung:** \(.aufforderung)\n\n**Hashtags:** \(.hashtags | join(" "))"' "tagebuch/$ID/eintrag.json"
            echo ""
            echo "![Post](https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$BR/tagebuch/$ID/post.jpg)"
          } | tee -a "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/sammelliste.md"
      - name: Zur Bewertung stellen
        if: steps.holen.outputs.gefunden == 'true'
        run: |
          gh label create sammelliste --repo "$GITHUB_REPOSITORY" --color B9A3FF --description "Sammelt die Posts zur Bewertung" 2>/dev/null || true
          SAMMEL=$(gh issue list --repo "$GITHUB_REPOSITORY" --label sammelliste --state open --json number --jq '.[0].number // empty')
          if [ -z "$SAMMEL" ]; then
            SAMMEL=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "Posts: Sammelliste" --label sammelliste \
              --body "Jeder Post hängt hier als Kommentar an. Urteil: Daumen hoch oder runter direkt am Eintrag, Begründung als eigener Kommentar, der mit gut oder schlecht beginnt." | grep -o '[0-9]*$')
          fi
          gh issue comment "$SAMMEL" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/sammelliste.md"
      - name: Posten
        if: steps.holen.outputs.gefunden == 'true' && env.LIVE == 'true'
        working-directory: autopilot
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_POSTEN: ${{ vars.FACEBOOK_POSTEN }}
        run: node posten.mjs "${{ steps.zeit.outputs.id }}"
      - name: Als gepostet markieren
        if: steps.holen.outputs.gefunden == 'true' && env.LIVE == 'true'
        run: |
          # Erst ab hier gilt der Slot als erledigt; scheitert das Posten, versucht es der nächste Lauf noch einmal
          ID="${{ steps.zeit.outputs.id }}"
          date -u +%FT%TZ > "tagebuch/$ID/gepostet.txt"
          git add "tagebuch/$ID/gepostet.txt"
          git commit -m "Gepostet $ID"
          git pull --rebase origin main && git push origin HEAD:main
      - name: Warteschlange abhaken
        if: steps.holen.outputs.gefunden == 'true' && env.LIVE == 'true'
        run: |
          gh issue close "${{ steps.holen.outputs.issue }}" --repo "$GITHUB_REPOSITORY" --comment "Gepostet als ${{ steps.zeit.outputs.id }}."
          for NR in $(gh issue list --repo "$GITHUB_REPOSITORY" --label leer --state open --json number --jq '.[].number'); do
            gh issue close "$NR" --repo "$GITHUB_REPOSITORY" --comment "Es wird wieder gepostet."
          done
      - name: YouTube Short
        if: steps.holen.outputs.gefunden == 'true' && env.LIVE == 'true' && vars.YOUTUBE_POSTEN == 'an' && hashFiles(format('tagebuch/{0}/reel.mp4', steps.zeit.outputs.id)) != ''
        working-directory: autopilot
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_SICHTBARKEIT: ${{ vars.YOUTUBE_SICHTBARKEIT }}
        run: node youtube.mjs "${{ steps.zeit.outputs.id }}" "../tagebuch/${{ steps.zeit.outputs.id }}/reel.mp4"
      - name: Token prüfen
        id: token
        # Auch wenn das Posten scheitert: ein abgelaufener Token ist dann meist der Grund
        if: ${{ !cancelled() && steps.holen.outputs.gefunden == 'true' && env.LIVE == 'true' }}
        working-directory: autopilot
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node token.mjs
      - name: Token-Ablauf melden
        if: ${{ !cancelled() && steps.token.outputs.tage != '' && fromJSON(steps.token.outputs.tage) < 14 }}
        run: |
          gh label create token --repo "$GITHUB_REPOSITORY" --color D73A4A --description "Instagram-Token läuft bald ab" 2>/dev/null || true
          if [ -z "$(gh issue list --repo "$GITHUB_REPOSITORY" --label token --state open --json number --jq '.[0].number // empty')" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --label token --assignee "${{ github.repository_owner }}" \
              --title "Instagram-Token läuft in ${{ steps.token.outputs.tage }} Tagen ab" \
              --body "Ohne neuen Token bricht das Posten ab. Neuen Token erzeugen und als Secret INSTAGRAM_ACCESS_TOKEN eintragen, dann dieses Issue schließen."
          fi
      - name: Bildvorrat prüfen
        id: vorrat
        if: steps.holen.outputs.gefunden == 'true' && env.LIVE == 'true'
        working-directory: autopilot
        run: node vorrat.mjs
      - name: Neue Bilder anfordern
        if: steps.vorrat.outputs.unbenutzt != '' && fromJSON(steps.vorrat.outputs.unbenutzt) < 7
        run: |
          gh label create bilder --repo "$GITHUB_REPOSITORY" --color 7B61FF --description "Bildbibliothek braucht Nachschub" 2>/dev/null || true
          if [ -z "$(gh issue list --repo "$GITHUB_REPOSITORY" --label bilder --state open --json number --jq '.[0].number // empty')" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --label bilder --assignee "${{ github.repository_owner }}" \
              --title "Bildbibliothek fast leer: noch ${{ steps.vorrat.outputs.unbenutzt }} unbenutzte Bilder" \
              --body "Von ${{ steps.vorrat.outputs.gesamt }} Bildern sind nur noch ${{ steps.vorrat.outputs.unbenutzt }} unbenutzt. Zeit für eine neue Runde in Gemini; die Bilder im Projekt-Chat hochladen, dann kommen sie in die Bibliothek. Dieses Issue schließen, wenn sie drin sind."
          fi
