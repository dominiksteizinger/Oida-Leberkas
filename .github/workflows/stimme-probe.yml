name: Stimme-Probe
# Probelauf für die KI-Stimme der Reels (Gemini-TTS, Free-Tier). Rendert Posts aus der Warteschlange in mehreren
# Stimmlagen und Tempi und legt die MP4s auf dem Branch stimme-probe ab.
# Nur von Hand (Actions > Stimme-Probe > Run workflow). Postet nichts und ändert weder main noch das Tagebuch.
on:
  workflow_dispatch:
    inputs:
      issues:
        description: "Issue-Nummern aus der Warteschlange, mit Leerzeichen getrennt"
        required: false
        default: "102 115"
      varianten:
        description: "Stimmlage:Tempo, mit Leerzeichen getrennt"
        required: false
        default: "muede:1.2 muede-regie:1.1 leda-regie:1.1 aoede-regie:1.1"
permissions:
  contents: write
  issues: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      STIMME: an
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Abhängigkeiten
        working-directory: autopilot
        run: |
          npm ci --no-audit --no-fund
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          fc-list | grep -qi "Noto Color Emoji" || (sudo apt-get install -y -q fonts-noto-color-emoji)
      - name: Reels mit Stimme rendern
        working-directory: autopilot
        env:
          ISSUES: ${{ inputs.issues }}
          VARIANTEN: ${{ inputs.varianten }}
        run: |
          mkdir -p "$RUNNER_TEMP/probe"
          for nr in $ISSUES; do
            id="probe-$nr"
            mkdir -p "../tagebuch/$id"
            gh issue view "$nr" --repo "$GITHUB_REPOSITORY" --json body -q .body \
              | node -e 'let b="";process.stdin.on("data",d=>b+=d).on("end",()=>{const p=JSON.parse(b.match(/```json\s*([\s\S]*?)```/)[1]);console.log(JSON.stringify({id:process.argv[1],datum:"2026-11-10",slot:"16",...p}))})' "$id" > "../tagebuch/$id/eintrag.json"
            node render.mjs "$id"
            for v in $VARIANTEN; do
              STIMME_STIL="${v%%:*}" STIMME_TEMPO="${v##*:}" node video.mjs "$id"
              cp "../tagebuch/$id/reel.mp4" "$RUNNER_TEMP/probe/$nr-${v%%:*}-${v##*:}.mp4"
            done
          done
          cp -r stimme-cache "$RUNNER_TEMP/probe/cache"
          ls -la "$RUNNER_TEMP/probe"
      - name: Auf Branch stimme-probe ablegen
        run: |
          # Eigener Ordner ohne Verlauf: der Branch enthält nur die Probe-Dateien, nichts vom Repo
          ARBEIT="$RUNNER_TEMP/stimme-probe"
          rm -rf "$ARBEIT" && mkdir -p "$ARBEIT/probe" && cp -r "$RUNNER_TEMP"/probe/* "$ARBEIT/probe/"
          cd "$ARBEIT"
          git init -q -b stimme-probe
          git config user.name "Resi Requiem Autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add probe && git commit -qm "Stimme-Probe: Testreels mit Stimme"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/stimme-probe
