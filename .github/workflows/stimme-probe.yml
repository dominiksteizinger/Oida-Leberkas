name: Stimme-Probe
# Probelauf für die KI-Stimme der Reels (Gemini-TTS, Free-Tier). Rendert zwei bestehende Tagebuch-Einträge
# mit Stimme und Untertiteln, je in der Stimmlage trocken und müde, und legt die MP4s auf dem Branch stimme-probe ab.
# Nur von Hand (Actions > Stimme-Probe > Run workflow). Postet nichts und ändert weder main noch das Tagebuch.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      STIMME: an
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Abhängigkeiten
        working-directory: autopilot
        run: npm ci --no-audit --no-fund
      - name: Reels mit Stimme rendern
        working-directory: autopilot
        run: |
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          mkdir -p "$RUNNER_TEMP/probe"
          for id in 2026-10-19-16 2026-10-18-16; do
            for stil in trocken muede; do
              STIMME_STIL=$stil node video.mjs "$id"
              cp "../tagebuch/$id/reel.mp4" "$RUNNER_TEMP/probe/$id-$stil.mp4"
              cp "../tagebuch/$id/untertitel.ass" "$RUNNER_TEMP/probe/$id-$stil.ass"
              git -C .. checkout -- "tagebuch/$id" 2>/dev/null || true
              rm -f "../tagebuch/$id/untertitel.ass"
            done
          done
          # Satz-Cache mitgeben, damit er nach dem Merge im Repo landen kann
          cp -r stimme-cache "$RUNNER_TEMP/probe/cache" 2>/dev/null || true
          ls -la "$RUNNER_TEMP/probe"
      - name: Auf Branch stimme-probe ablegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Eigener Ordner ohne Verlauf: der Branch enthält nur die Probe-Dateien, nichts vom Repo
          ARBEIT="$RUNNER_TEMP/stimme-probe"
          rm -rf "$ARBEIT" && mkdir -p "$ARBEIT/probe" && cp -r "$RUNNER_TEMP"/probe/* "$ARBEIT/probe/"
          cd "$ARBEIT"
          git init -q -b stimme-probe
          git config user.name "Resi Requiem Autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add probe && git commit -qm "Stimme-Probe: Testreels mit Stimme"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/stimme-probe
