name: Wochenauswertung
# Jeden Montag: Instagram-Insights und YouTube Analytics abfragen, den Bericht als Datei auswertung/<datum>.md ablegen
# und als Kommentar an das Issue „Wochenauswertung“ hängen. Fehlen Token oder Rechte, überspringt der Lauf den Teil und sagt es im Bericht.
# Anleitung für die nötigen Rechte: autopilot/messung-anleitung.md
on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:
    inputs:
      tage:
        description: "Zeitraum in Tagen"
        required: false
        default: "28"
permissions:
  contents: write
  issues: write
concurrency:
  group: messung
  cancel-in-progress: false
jobs:
  auswerten:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Abhängigkeiten
        working-directory: autopilot
        run: npm ci --no-audit --no-fund
      - name: Auswerten
        id: messung
        working-directory: autopilot
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node messung.mjs "${{ inputs.tage || '28' }}"
      - name: Bericht ablegen
        run: |
          git config user.name "Resi Requiem Autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add auswertung
          git diff --cached --quiet || git commit -m "Wochenauswertung ${{ steps.messung.outputs.datei }}"
          git pull --rebase origin main && git push origin HEAD:main
      - name: Bericht ans Issue hängen
        run: |
          gh label create auswertung --repo "$GITHUB_REPOSITORY" --color 0E8A16 --description "Wöchentliche Insights-Auswertung" 2>/dev/null || true
          NR=$(gh issue list --repo "$GITHUB_REPOSITORY" --label auswertung --state open --json number --jq '.[0].number // empty')
          if [ -z "$NR" ]; then
            NR=$(gh issue create --repo "$GITHUB_REPOSITORY" --label auswertung --assignee "${{ github.repository_owner }}" --title "Wochenauswertung" \
              --body "Jeden Montag hängt hier der Bericht an (Instagram-Insights, YouTube Analytics). Die Dateien liegen auch unter auswertung/. Fehlende Rechte stehen im Bericht, Anleitung: autopilot/messung-anleitung.md." | grep -o '[0-9]*$')
          fi
          gh issue comment "$NR" --repo "$GITHUB_REPOSITORY" --body-file "${{ steps.messung.outputs.datei }}"
