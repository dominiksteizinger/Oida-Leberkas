name: Stimmen vorab
# Füllt zweimal täglich den Stimmen-Cache (Gemini-TTS) für die Posts in der Warteschlange, verteilt unter dem Free-Tier-Limit,
# damit die Reels live ohne Gemini-Aufruf eine Stimme bekommen. Läuft vor dem Morgen- und dem Nachmittagspost.
on:
  schedule:
    - cron: "40 4,11 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "Höchstens so viele neue Sätze in diesem Lauf"
        required: false
        default: "100"
permissions:
  contents: write
  issues: read
concurrency:
  group: stimme-vorab
  cancel-in-progress: false
jobs:
  vorab:
    runs-on: ubuntu-latest
    # Nur der Hauptzweig, nur wenn die Stimme überhaupt an ist
    if: github.ref == 'refs/heads/main' && vars.STIMME == 'an'
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Abhängigkeiten
        working-directory: autopilot
        run: |
          npm ci --no-audit --no-fund
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          fc-list | grep -qi "Noto Color Emoji" || (sudo apt-get install -y -q fonts-noto-color-emoji)
      - name: Cache füllen
        id: vorab
        working-directory: autopilot
        env:
          STIMME: ${{ vars.STIMME }}
          STIMME_STIL: ${{ vars.STIMME_STIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX: ${{ inputs.max }}
        run: node stimme-vorab.mjs --max "${MAX:-100}"
      - name: Cache einchecken
        run: |
          git config user.name "Resi Requiem Autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add autopilot/stimme-cache
          git diff --cached --quiet && exit 0
          git commit -m "Stimmen-Cache: ${{ steps.vorab.outputs.neu }} neue Sätze"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break || sleep 5; done
