name: Probe Mini-Szene (temporär)
# Holt nur die Stimme für die Sätze in probe-mini-szene/saetze.json in den Cache (ohne apt, ohne Rendern)
on:
  push:
    branches: [claude/project-thread-y8otbn]
    paths: [.github/workflows/probe-mini-szene.yml, probe-mini-szene/saetze.json]
permissions:
  contents: write
concurrency:
  group: probe-mini-szene
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STIMME: an
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stimme holen
        working-directory: autopilot
        run: |
          npm ci --no-audit --no-fund
          # apt hing am 22.10. auf dem Runner, daher statisches ffmpeg aus npm
          if ! command -v ffmpeg; then
            mkdir -p "$RUNNER_TEMP/ff" && (cd "$RUNNER_TEMP/ff" && npm i --no-audit --no-fund ffmpeg-static@5.2.0 ffprobe-static@3.1.0)
            mkdir -p "$RUNNER_TEMP/bin"
            ln -sf "$RUNNER_TEMP/ff/node_modules/ffmpeg-static/ffmpeg" "$RUNNER_TEMP/bin/ffmpeg"
            ln -sf "$(find "$RUNNER_TEMP/ff/node_modules/ffprobe-static/bin/linux/x64" -name ffprobe)" "$RUNNER_TEMP/bin/ffprobe"
            export PATH="$RUNNER_TEMP/bin:$PATH"
          fi
          ffmpeg -version | head -1
          node --input-type=module -e '
            import fs from "node:fs"; import { vorfuellen } from "./stimme.mjs";
            for (const t of JSON.parse(fs.readFileSync("../probe-mini-szene/saetze.json", "utf8"))) {
              console.log((await vorfuellen(t)) ? "neu" : "schon da", t);
              await new Promise((r) => setTimeout(r, 6000));
            }'
      - name: Cache auf den Branch legen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add autopilot/stimme-cache
          git commit -m "Probe Mini-Szene: Stimme gerendert"
          git push
