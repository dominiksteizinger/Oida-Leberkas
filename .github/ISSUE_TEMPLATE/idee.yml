name: Idee für den Autopilot
description: Ein Beitrag von Instagram, TikTok und Co als Vorlage
title: "Idee: "
labels: [idee]
body:
  - type: input
    id: link
    attributes:
      label: Link
      description: Der Autopilot kann den Link nicht öffnen, er dient nur dir als Erinnerung.
      placeholder: https://www.instagram.com/p/...
  - type: textarea
    id: warum
    attributes:
      label: Was ist daran gut?
      description: Aufbau, Pointe, Stimmung, Format. Davon lebt die Idee, also konkret beschreiben.
      placeholder: "Zwei Folien, erst todernst, dann kippt es mit einem einzigen trockenen Satz."
    validations:
      required: true
  - type: textarea
    id: bild
    attributes:
      label: Screenshot (optional)
      description: Hier hineinziehen. Nur für dich, der Autopilot liest nur den Text.
